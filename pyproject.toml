[project]
name = "test-task2-becloud"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.54",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.black]
line-length = 79
skip-magic-trailing-comma = true

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
exclude = ["venv", ".venv"]

[tool.isort]
profile = "black"
line_length = 79
skip = [".venv", "venv", ".git"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = [
    "tests",
]

